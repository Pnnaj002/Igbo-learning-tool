function saveSoon(){
  lsSet(S);
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{ if(store.doc){ try{await store.doc.set({json:JSON.stringify(S),at:Date.now()})}catch(e){} } },700);
}
async function initStore(){
  const local=lsGet(); if(local) S=Object.assign(S,local);
  try{
    if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    store.doc=db.collection("data/users/"+id).doc("progress");
    store.kind="db";
    const snap=await store.doc.get();
    if(snap.exists){const d=snap.data(); if(d&&d.json){const r=JSON.parse(d.json); if(!local||(d.at||0)>=(local._at||0)) S=Object.assign(S,r);} }
    else if(local) saveSoon();
  }catch(e){store.doc=null}
}
function touch(){S._at=Date.now();saveSoon()}

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function weekNum(d){return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-START)/(7*DAY))+1}
function weekStart(wk){return new Date(START.getFullYear(),START.getMonth(),START.getDate()+(wk-1)*7)}
const fmt=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtL=d=>d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
function curWeek(){const w=weekNum(new Date());return Math.min(24,Math.max(1,w))}
function dayMins(key){const o=S.done[key]||{};return Object.keys(o).filter(k=>o[k]).reduce((a,k)=>a+(BLOCKS[k]?BLOCKS[k].m:0),0)}
function streak(){
  let d=new Date(),n=0;d=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(!dayMins(iso(d))){d=new Date(d.getTime()-DAY)}
  while(dayMins(iso(d))>0){n++;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1)}
  return n;
}
function weekMins(wk){let t=0;const s=weekStart(wk);for(let i=0;i<7;i++){const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i);t+=dayMins(iso(d))}return t}
function weekImm(wk){let t=0;const s=weekStart(wk);for(let i=0;i<7;i++){const d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+i);t+=S.imm[iso(d)]||0}return t}
function ensureCards(){
  if(!S.cards.length){S.cards=STARTER.map((c,i)=>({id:"s"+i,en:c[0],ig:c[1],deck:c[2],box:0,due:"",starter:true}));}
}
function addDays(n){const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+n))}
const INTERVALS=[0,1,3,7,14,30];

function bartPicks(wk){
  const pool=MEDIA.filter(m=>m.url&&["Podcast","Conversation","Story","Proverbs","News","Dialects"].includes(m.type)&&m.lvl<=(wk<=6?1:wk<=12?2:3));
  const n=new Date();const seed=n.getFullYear()*400+n.getMonth()*31+n.getDate();
  return [pool[seed%pool.length],pool[(seed*7+3)%pool.length]].filter((m,i,a)=>a.indexOf(m)===i);
}
function vToday(){
  const now=new Date(), wkRaw=weekNum(now), wk=Math.min(24,Math.max(1,wkRaw));
  const mode=MODES[wk-1];
  const key=iso(now);
  let h="";
  if(wkRaw<1){const dl=Math.ceil((START-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/DAY);
    h+=`<div class="card"><span class="pill">Before start</span><h2 style="margin-top:8px">Starts in ${dl} day${dl===1?"":"s"}</h2><p class="muted">Week 1 begins Monday, Nov 23. Today, do the pre-work: record your three baseline clips (Progress tab) so you can compare in May.</p></div>`;}
  const ids=wkRaw<1?["floor"]:blocksFor(now,mode);
  const mins=dayMins(key);
  h+=`<div class="card"><div class="row"><div class="grow"><div class="small muted">${fmtL(now)}</div>
    <h2>${esc(FOCUS[wk-1])}</h2>
    <div class="chips"><span class="pill">Mode ${mode}</span><span class="pill o">${esc(CLASSNOTE[wk]||"Regular class week")}</span></div></div>
    <div style="text-align:right"><div class="igbo">${mins}</div><div class="small muted">min today</div></div></div></div>`;
  h+=`<div class="card"><h3>Today's plan</h3>`;
  for(const id of ids){const b=BLOCKS[id];const ck=!!(S.done[key]&&S.done[key][id]);
    h+=`<div class="block ${ck?"done":""}"><input type="checkbox" id="c-${id}" data-chk="${id}" ${ck?"checked":""} aria-label="${esc(b.t)}">
      <div class="grow"><label for="c-${id}" class="t big" style="font-weight:600">${esc(b.t)}</label> <span class="mins">${b.m} min</span>
      <div class="small muted">${esc(b.d)}</div>${b.tab?`<button class="chip" data-tab="${b.tab}" style="margin-top:6px">Open ${b.tab}</button>`:""}</div></div>`;}
  if(!ids.includes("floor")){const ck=!!(S.done[key]&&S.done[key].floor);
    h+=`<div class="block ${ck?"done":""}"><input type="checkbox" id="c-floor" data-chk="floor" ${ck?"checked":""} aria-label="5-minute floor"><div class="grow"><label for="c-floor" class="t" style="font-weight:600">5-minute floor</label> <span class="mins">5 min</span><div class="small muted">On a hard day, this alone keeps your streak.</div></div></div>`;}
  h+=`</div>`;
  if(ids.includes("bart")){
    h+=`<div class="card"><h3>BART picks for today</h3><p class="small muted">Chosen for your current level. Listen, replay one minute, mouth it silently.</p>`;
    for(const m of bartPicks(wk)) h+=`<div style="margin:8px 0"><a href="${esc(m.url)}" target="_blank" rel="noopener" style="font-weight:600;color:var(--accent)">${esc(m.t)}</a> <span class="pill o">${esc(m.type)}</span><div class="small muted">${esc(m.d)}</div></div>`;
    h+=`</div>`;}
  const due=ensureCards()||S.cards.filter(c=>!c.due||c.due<=key).length;
  h+=`<div class="card"><div class="row"><div class="grow"><h3>Cards due</h3><div class="small muted">Vault keeps old knowledge warm; Gap holds new words.</div></div><button class="btn" data-tab="drill">${due} due</button></div></div>`;
  h+=`<div class="note">This app teaches Standard Igbo, the most widely understood form (used in BBC Igbo, schools and church). When family says something differently you can note it in the Progress tab, but you don't need to change how you talk at home.</div>`;
  return h;
}

function vPlan(){
  const cw=weekNum(new Date());
  let h=`<div class="card"><h2>24 weeks, Nov 23 to May 9</h2><p class="small muted">Sundays and Mondays are always free. Heavy class weeks drop to mode A (floor + Sunday call). Break weeks run mode C. Spring dates are provisional.</p></div>`;
  h+=`<div class="card scroll"><table><thead><tr><th>Wk</th><th>Dates</th><th>Mode</th><th>Focus</th></tr></thead><tbody>`;
  for(let w=1;w<=24;w++){const s=weekStart(w),e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);

    h+=`<tr class="${w===cw?"now":""}"><td>${w}</td><td>${fmt(s)}–${fmt(e)}</td><td>${MODES[w-1]}</td><td>${esc(FOCUS[w-1])}<div class="small muted">${esc(CLASSNOTE[w]||"")}</div>${ms}</td></tr>`;}

  return h;
}

/* ---- Drill ---- */
let dsub="verbs", vcur=null, vrev=false, ccur=null, crev=false, cdeck="all";
function pickVerb(){
  for(let tries=0;tries<6;tries++){
    const v=VERBS[Math.floor(Math.random()*VERBS.length)], t=Object.keys(TENSES)[Math.floor(Math.random()*6)];
    const st=S.vstat[v.root+t]||{ok:0,miss:0};
    if(tries<3 && st.miss<=st.ok && Math.random()<.5) continue;
    vcur={v,t};return;
  }
}
function vDrill(){
  ensureCards();
  let h=`<div class="tabs-sub">${[["verbs","Verbs"],["cards","Cards"],["tone","Tone"]].map(t=>`<button class="chip" data-dsub="${t[0]}" aria-pressed="${dsub===t[0]}">${t[1]}</button>`).join("")}</div>`;
  if(dsub==="verbs"){
    if(!vcur) pickVerb();
    const {v,t}=vcur,f=v.f[t],key=v.root+t,ov=S.vover[key];
    h+=`<div class="card"><span class="pill">${esc(TENSES[t])}</span> <span class="pill o">${esc(v.root)} · ${esc(v.en)}</span>
      <p class="big" style="margin:12px 0 4px">Say it in Igbo, out loud:</p><div class="igbo" style="font-family:var(--body);font-weight:600">${esc(f[1])}</div>`;
    if(vrev){
      h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="small muted">Standard Igbo</div><div class="igbo">${esc(f[0])}</div>
        ${ov?`<div class="small muted" style="margin-top:8px">Your family's form</div><div class="igbo" style="color:var(--ochre)">${esc(ov)}</div>`:""}
        <div style="margin-top:12px"><label class="small muted" for="ovin">My family says it differently (optional):</label>
        <div class="row" style="margin-top:4px"><input type="text" id="ovin" value="${esc(ov||"")}" placeholder="Type their version (optional)"><button class="btn ghost" data-act="saveov">Save</button></div></div>
        <div class="chips" style="margin-top:14px"><button class="btn good" data-act="vok">Fast and right</button><button class="btn ghost" data-act="vslow">Slow</button><button class="btn bad" data-act="vmiss">Missed</button></div>`;
    }else h+=`<div style="margin-top:14px"><button class="btn" data-act="vshow">Show answer</button></div>`;
    h+=`</div><p class="small muted">Goal: any verb in any form in under 5 seconds, no thinking. Forms use "m" (I). These are Standard Igbo patterns. The box is optional, for forms your family says differently.</p>`;
  }
  if(dsub==="cards"){
    const key=iso(new Date());
    const due=S.cards.filter(c=>(cdeck==="all"||c.deck===cdeck)&&(!c.due||c.due<=key));
    h+=`<div class="chips">${["all","vault","gap"].map(d=>`<button class="chip" data-cdeck="${d}" aria-pressed="${cdeck===d}">${d==="all"?"All":d==="vault"?"Vault (old knowledge)":"Gap (new)"}</button>`).join("")}</div>`;
    if(!due.length){h+=`<div class="card"><h3>All caught up</h3><p class="muted">No cards due. Add new words below.</p></div>`;ccur=null}
    else{
      if(!ccur||!due.find(c=>c.id===ccur)) ccur=due[Math.floor(Math.random()*due.length)].id;
      const c=S.cards.find(x=>x.id===ccur);
      h+=`<div class="card"><span class="pill">${c.deck==="vault"?"Vault":"Gap"}</span> <span class="small muted">${due.length} due</span>
        <p class="small muted" style="margin:12px 0 4px">Say this in Igbo:</p><div class="igbo" style="font-family:var(--body);font-weight:600">${esc(c.en)}</div>`;
      if(crev){h+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="igbo">${esc(c.ig)}</div>${c.starter?`<div class="small muted">Starter card (Standard Igbo). Edit it only if you want a different form.</div>`:""}
        <div class="chips" style="margin-top:14px"><button class="btn good" data-act="cok">Fast and right</button><button class="btn ghost" data-act="cslow">Slow</button><button class="btn bad" data-act="cmiss">Missed</button></div>
        <div class="row" style="margin-top:8px"><input type="text" id="cedit" value="${esc(c.ig)}" aria-label="Edit Igbo"><button class="btn ghost" data-act="cedit">Save</button></div>`;}
      else h+=`<div style="margin-top:14px"><button class="btn" data-act="cshow">Show answer</button></div>`;
      h+=`</div>`;
    }
    h+=`<div class="card"><h3>Add a card</h3><p class="small muted">Words you lacked while talking go in Gap. Things you already know but want to keep go in Vault.</p>
      <label class="small muted" for="nen">English</label><input type="text" id="nen"><label class="small muted" for="nig" style="display:block;margin-top:8px">Igbo</label><input type="text" id="nig">
      <div class="chips"><button class="btn" data-act="addcard" data-deck="gap">Add to Gap</button><button class="btn ghost" data-act="addcard" data-deck="vault">Add to Vault</button></div></div>`;
  }
  if(dsub==="tone"){
    h+=`<div class="card"><h3>Tone changes the meaning</h3><p class="small muted">Igbo has high and low tones (and downstep). Say each one, record, and compare with your parent. Marks: acute = high, grave = low.</p>
    <table><tbody><tr><td class="igbo">ákwá</td><td>cry</td></tr><tr><td class="igbo">àkwà</td><td>bed</td></tr><tr><td class="igbo">ákwà</td><td>cloth</td></tr><tr><td class="igbo">àkwá</td><td>egg</td></tr></tbody></table>
    <p class="small">Drill: say the four in random order to yourself, then ask a relative to say them.</p></div>
    <div class="note">Tone and some vowels vary by region. Learn the standard patterns here and log your family's variants in the notebook if you like.</div>`;
  }
  return h;
}

}

    <div class="row"><div class="grow"><label class="small muted" for="dm">Meaning</label><input type="text" id="dm"></div></div>
    <div class="row" style="margin-top:6px"><div class="grow"><label class="small muted" for="de">Family says</label><input type="text" id="de"></div><div class="grow"><label class="small muted" for="ds">Standard Igbo</label><input type="text" id="ds"></div></div>
    <div class="chips"><button class="btn" data-act="adddial">Add</button><button class="btn ghost" data-act="dialcard">Also make a Gap card</button></div>`;
  if(S.dial.length) h+=`<div class="scroll"><table><thead><tr><th>Meaning</th><th>Family</th><th>Standard Igbo</th></tr></thead><tbody>${S.dial.slice().reverse().map(r=>`<tr><td>${esc(r.m)}</td><td><b>${esc(r.e)}</b></td><td>${esc(r.s)}</td></tr>`).join("")}</tbody></table></div>`;
  h+=`</div><div class="card"><h3>Where your data lives</h3><p class="small muted">${store.kind==="db"?"Saved to your private space in this artifact and mirrored in this browser.":"Saved in this browser only (private mode or cleared data erases it)."}</p></div>`;
  return h;
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a,input,label");if(!t)return;
  const d=t.dataset||{};
  if(d.tab){tab=d.tab;render();window.scrollTo(0,0);return}
  if(d.dsub){dsub=d.dsub;render();return}
  if(d.cdeck){cdeck=d.cdeck;ccur=null;crev=false;render();return}
  if(d.mf){mfilter=d.mf;render();return}
  const a=d.act;if(!a)return;
  const key=iso(new Date());
  if(a==="vshow"){vrev=true}
  else if(a==="vok"||a==="vslow"||a==="vmiss"){const k=vcur.v.root+vcur.t;const s=S.vstat[k]||(S.vstat[k]={ok:0,miss:0});if(a==="vok")s.ok++;if(a==="vmiss")s.miss++;vrev=false;pickVerb();touch()}
  else if(a==="saveov"){const v=$("#ovin").value.trim();const k=vcur.v.root+vcur.t;if(v){S.vover[k]=v;touch()}else{delete S.vover[k];touch()}}
  else if(a==="cshow"){crev=true}
  else if(a==="cok"||a==="cslow"||a==="cmiss"){const c=S.cards.find(x=>x.id===ccur);if(c){if(a==="cok")c.box=Math.min(5,c.box+1);if(a==="cmiss")c.box=0;c.due=addDays(INTERVALS[c.box]||0)}crev=false;ccur=null;touch()}
  else if(a==="cedit"){const c=S.cards.find(x=>x.id===ccur);const v=$("#cedit").value.trim();if(c&&v){c.ig=v;c.starter=false;touch()}}
  else if(a==="addcard"){const en=$("#nen").value.trim(),ig=$("#nig").value.trim();if(en&&ig){S.cards.push({id:"u"+Date.now(),en,ig,deck:d.deck,box:0,due:""});touch()}}
  else if(a==="newprompt"){pickPrompt()}
  else if(a==="tstart"){if(tmr.run){clearInterval(tmr.h);tmr.run=false}else{if(tmr.left<=0)tmr.left=tmr.len;tmr.run=true;tmr.h=setInterval(tick,1000)}}
  else if(a==="treset"){clearInterval(tmr.h);tmr.run=false;tmr.left=tmr.len}
  else if(a==="tlen"){clearInterval(tmr.h);tmr.run=false;tmr.len=+d.s;tmr.left=tmr.len}
  else if(a==="logerr"){const v=$("#errin").value.trim();if(v){S.errs.push({d:key,t:v});touch()}}
  else if(a==="imm"){S.imm[key]=Math.max(0,(S.imm[key]||0)+ +d.n);touch()}
  else if(a==="adddial"||a==="dialcard"){const m=$("#dm").value.trim(),en=$("#de").value.trim(),s=$("#ds").value.trim();if(m&&en){S.dial.push({m,e:en,s});if(a==="dialcard")S.cards.push({id:"d"+Date.now(),en:m,ig:en,deck:"gap",box:0,due:""});touch()}}
  else return;
  render();
});
document.addEventListener("change",e=>{
  const t=e.target,d=t.dataset||{};const key=iso(new Date());
  if(d.chk){(S.done[key]||(S.done[key]={}))[d.chk]=t.checked;touch();render()}
  else if(d.media){S.media[d.media]=t.checked;touch()}
  else if(d.mini!==undefined){const wk=curWeek();(S.mini[wk]||(S.mini[wk]={}))[d.mini]=+t.value;touch();render()}
  else if(d.base!==undefined){S.base[d.base]=t.checked;touch()}
  else if(d.mile){(S.mile[d.mile]||(S.mile[d.mile]={})).pass=t.checked;touch()}
  else if(d.milenote){(S.mile[d.milenote]||(S.mile[d.milenote]={})).note=t.value;touch()}
});

ensureCards();
render();
initStore().then(()=>{ensureCards();render()});
</script>
